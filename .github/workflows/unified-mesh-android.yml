name: Unified Mesh Android

# Builds the Unified Mesh app on GitHub's runners, which already have the
# Android SDK installed. This is what makes the project buildable without a
# development machine: the APK comes out as a downloadable artifact.
on:
  push:
    branches:
      - "claude/unified-mesh-**"
    paths:
      - "unified-mesh/**"
      - ".github/workflows/unified-mesh-android.yml"
  pull_request:
    paths:
      - "unified-mesh/**"
  # Lets the build be started by hand from the Actions tab.
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight build of the same branch.
  group: unified-mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # These tests take seconds. Anything approaching this limit is a hang, and a
    # bounded failure with logs is far more useful than the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The protocol, bridge and orchestration modules are plain Kotlin/JVM, so
      # they are tested first and fail fast without touching the Android SDK.
      - name: Run JVM unit tests
        working-directory: unified-mesh
        run: >
          ./gradlew --no-daemon --stacktrace --no-configuration-cache
          :core:bridge:test
          :core:radio:test
          :protocol:api:test
          :protocol:meshcore:test
          :protocol:meshtastic:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: unified-mesh/**/build/reports/tests/**
          retention-days: 14

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Needed only to publish the APK release; the test job stays read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: unified-mesh
        run: ./gradlew --no-daemon --stacktrace --no-configuration-cache :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: unified-mesh-debug-apk
          path: unified-mesh/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # A build that fails is the useful case here, so keep whatever the
      # Android Gradle Plugin wrote about why.
      # A GitHub artifact downloads as a .zip, which Android will not install.
      # Publishing the APK as a prerelease asset gives a direct link that
      # installs straight from a phone browser, with no unzipping.
      - name: Publish the APK as a rolling prerelease
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: unified-mesh
        run: |
          set -euo pipefail
          TAG="latest-debug"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" "unified-mesh-debug.apk"
          # Recreate the release each time so the tag always points at this build.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" "unified-mesh-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Unified Mesh debug build" \
            --prerelease \
            --notes "Debug APK from ${GITHUB_SHA:0:7}. Unsigned debug build for testing; enable install from unknown sources to install it."

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            unified-mesh/**/build/reports/**
            unified-mesh/build/reports/**
          retention-days: 14
